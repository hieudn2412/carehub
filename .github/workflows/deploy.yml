name: CI and Deploy CareHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carehub-production
  cancel-in-progress: false

env:
  VITE_API_BASE_URL: https://api.fpthub.online/api/v1

jobs:
  backend-ci:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        working-directory: carehub-backend
        run: mvn --batch-mode --no-transfer-progress test

  frontend-ci:
    name: Test and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: carehub-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: carehub-frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: carehub-frontend
        run: npm run test:evidence

      - name: Build frontend
        working-directory: carehub-frontend
        run: npm run build

  deploy:
    name: Deploy production to VPS
    needs:
      - backend-ci
      - frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$VPS_SSH_KEY" | base64 --decode > "$HOME/.ssh/carehub_deploy_key"
          chmod 600 "$HOME/.ssh/carehub_deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/carehub_deploy_key" > /dev/null
          echo "Deployment key fingerprint:"
          ssh-keygen -y -f "$HOME/.ssh/carehub_deploy_key" \
            | ssh-keygen -lf - -E sha256
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH authentication
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_USER"
          ssh \
            -v \
            -i "$HOME/.ssh/carehub_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "echo 'SSH authentication successful.'"

      - name: Deploy exact commit and health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/carehub_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'CAREHUB_DEPLOY'
          set -Eeuo pipefail

          APP_DIR=/opt/carehub/carehub
          COMPOSE_FILE=compose.prod.yml
          PREVIOUS_SHA=""
          STACK_UPDATED=false

          wait_for_status() {
            local name="$1"
            local url="$2"
            local expected_status="$3"
            local status="000"

            for attempt in $(seq 1 30); do
              status=$(curl \
                --silent \
                --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 5 \
                "$url" || true)

              if [ "$status" = "$expected_status" ]; then
                echo "$name is ready (HTTP $status)."
                return 0
              fi

              echo "Waiting for $name: attempt $attempt/30, HTTP $status"
              sleep 2
            done

            echo "$name health check failed: expected HTTP $expected_status, got HTTP $status." >&2
            return 1
          }

          rollback() {
            local exit_code="$1"
            trap - ERR

            echo "Deployment failed. Showing container status and recent logs..." >&2
            docker compose -f "$COMPOSE_FILE" ps || true
            docker compose -f "$COMPOSE_FILE" logs --tail=150 backend frontend || true

            if [ "$STACK_UPDATED" = true ] && [ -n "$PREVIOUS_SHA" ]; then
              echo "Rolling application source back to $PREVIOUS_SHA..." >&2
              git reset --hard "$PREVIOUS_SHA"
              docker compose -f "$COMPOSE_FILE" config --quiet
              docker compose -f "$COMPOSE_FILE" build
              docker compose -f "$COMPOSE_FILE" up -d --remove-orphans
              echo "Basic application rollback completed." >&2
            fi

            exit "$exit_code"
          }

          trap 'rollback $?' ERR

          case "$DEPLOY_SHA" in
            ""|*[!0-9a-f]*)
              echo "Invalid deployment SHA." >&2
              exit 1
              ;;
          esac

          cd "$APP_DIR"

          test -f "$COMPOSE_FILE"
          test -f deploy/backend.env
          docker compose version

          PREVIOUS_SHA=$(git rev-parse HEAD)

          echo "Fetching commit $DEPLOY_SHA..."
          git fetch --prune origin main
          git cat-file -e "$DEPLOY_SHA^{commit}"
          git checkout --force main
          git reset --hard "$DEPLOY_SHA"

          echo "Validating Docker Compose configuration..."
          docker compose -f "$COMPOSE_FILE" config --quiet

          echo "Building production images..."
          docker compose -f "$COMPOSE_FILE" build

          echo "Starting production containers..."
          STACK_UPDATED=true
          docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

          wait_for_status \
            "frontend" \
            "http://127.0.0.1:5173/" \
            "200"

          # GET /auth/login returns 405 because the endpoint only accepts POST.
          # This proves Spring Boot is reachable without exposing credentials.
          wait_for_status \
            "backend" \
            "http://127.0.0.1:8081/api/v1/auth/login" \
            "405"

          trap - ERR

          docker compose -f "$COMPOSE_FILE" ps
          docker image prune -f

          echo "Successfully deployed $DEPLOY_SHA."
          CAREHUB_DEPLOY

      - name: Verify public domains
        run: |
          frontend_status=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://app.fpthub.online/)

          backend_status=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            https://api.fpthub.online/api/v1/auth/login)

          test "$frontend_status" = "200"
          test "$backend_status" = "405"

          echo "Public frontend is healthy (HTTP $frontend_status)."
          echo "Public backend is healthy (HTTP $backend_status)."
