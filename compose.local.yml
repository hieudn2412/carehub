name: carehub-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carehub
      POSTGRES_USER: carehub
      POSTGRES_PASSWORD: carehub_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_local:/var/lib/postgresql/data
      - ./carehub-backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./carehub-backend/docker/postgres/baseline:/baseline:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carehub -d carehub"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: carehub
      RABBITMQ_DEFAULT_PASS: carehub_local
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_local:/var/lib/rabbitmq

volumes:
  postgres_local:
  rabbitmq_local:
