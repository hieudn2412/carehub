server:
  port: ${SERVER_PORT:8081}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS}
  import:
    # Production must provide a strong value; there is no weak fallback here.
    default-password: ${DEFAULT_PASSWORD}
  notification:
    rabbit-listener-enabled: ${RABBITMQ_LISTENER_ENABLED:true}
  seed:
    enabled: ${APP_SEED_ENABLED:false}

ai:
  embedding:
    provider: ${EMBEDDING_PROVIDER:lexical}
    preload: ${E5_PRELOAD:false}
    backfill-on-startup: ${E5_BACKFILL_ON_STARTUP:false}
  paraphrase:
    provider: ${PARAPHRASE_PROVIDER:disabled}
    preload: ${VIETQUILL_PRELOAD:false}

document:
  storage-path: ${DOCUMENT_STORAGE_PATH:/data/documents}

management:
  health:
    # SMTP availability must not make the whole application unhealthy. Email
    # delivery still reports its own failures through the notification flow.
    mail:
      enabled: false

spring:
  devtools:
    restart:
      enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 17
    validate-on-migrate: true
    validate-migration-naming: true

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    dynamic: ${RABBITMQ_LISTENER_ENABLED:true}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:true}
      direct:
        auto-startup: ${RABBITMQ_LISTENER_ENABLED:true}
