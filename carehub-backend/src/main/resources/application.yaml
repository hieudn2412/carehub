server:
  port: ${SERVER_PORT:8081}

app:
  evaluation:
    cutover:
      direct-field: ${EVAL_QUESTION_DIRECT_FIELD:true}
      cognitive-verified: ${EVAL_COGNITIVE_VERIFIED:false}
      audience-rules-v1: ${EVAL_AUDIENCE_RULES_V1:false}
      legacy-inline-audience-enabled: ${EVAL_LEGACY_INLINE_AUDIENCE_ENABLED:false}
      multi-field-blueprint: ${EVAL_MULTI_FIELD_BLUEPRINT:true}
      multi-field-generation: ${EVAL_MULTI_FIELD_GENERATION:false}
      field-results: ${EVAL_FIELD_RESULTS:true}
  notification:
    # Notification bootstrap/scanning are explicit opt-in. Keeping them off by
    # default prevents an ordinary IDE run from mutating a database or starting
    # background work unexpectedly.
    seed-enabled: ${APP_NOTIFICATION_SEED_ENABLED:false}
    scheduling-enabled: ${APP_NOTIFICATION_SCHEDULING_ENABLED:false}
    # The legacy constraint fixer performs ALTER TABLE at startup. It is only
    # needed when the notification schema/seed worker is explicitly enabled.
    schema-fix-enabled: ${APP_NOTIFICATION_SCHEMA_FIX_ENABLED:false}
    rabbit-listener-enabled: ${RABBITMQ_LISTENER_ENABLED:false}
    scan-cron: ${APP_NOTIFICATION_SCAN_CRON:0 0 7 * * *}
    zone: ${APP_NOTIFICATION_ZONE:Asia/Bangkok}

  exam:
    business-zone: ${APP_EXAM_BUSINESS_ZONE:Asia/Ho_Chi_Minh}

  form-import:
    max-batch-size: 25
    google-public:
      enabled: ${GOOGLE_PUBLIC_FORM_IMPORT_ENABLED:true}
      connect-timeout: 5s
      read-timeout: 20s
      max-response-bytes: 5242880

  import:
    default-password: ${DEFAULT_PASSWORD}

  api-prefix: /api/v1
  competency:
    weight:
      knowledge: ${COMPETENCY_WEIGHT_KNOWLEDGE:0.5}
      skill: ${COMPETENCY_WEIGHT_SKILL:0.5}
    compliance:
      default-target: ${COMPETENCY_DEFAULT_TARGET:80.0}
  jwt:
    secret: ${JWT_SECRET}
    refresh-secret: ${AUTH_REFRESH_SECRET:${JWT_REFRESH_SECRET:${JWT_SECRET}}}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 60
    first-login-refresh-token-expiration-hours: 24
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
    refresh-token-cleanup-cron: ${JWT_REFRESH_CLEANUP_CRON:0 20 3 * * *}
  seed:
    # Seeding is an explicit development/bootstrap action. Never overwrite
    # taxonomy or application data during a normal restart.
    enabled: ${APP_SEED_ENABLED:false}
    admin:
      employee-code: ${ADMIN_EMPLOYEE_CODE}
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
      name: ${ADMIN_NAME}
    question-bank:
      enabled: ${APP_SEED_QUESTION_BANK_ENABLED:false}
      resource: ${APP_SEED_QUESTION_BANK_RESOURCE:classpath:question-bank/hospital-review-questions.json}
    professional-fields:
      resource: ${APP_SEED_PROFESSIONAL_FIELDS_RESOURCE:classpath:professional-fields/nursing-professional-fields.json}

ai:
  generation:
    provider: ${GENERATION_PROVIDER:api}
    api-base-url: ${GENERATION_API_BASE_URL:https://api.deepseek.com}
    api-key: ${GENERATION_API_KEY:${DEEPSEEK_API_KEY:}}
    model: ${GENERATION_MODEL:deepseek-v4-flash}
    fallback-model: ${GENERATION_FALLBACK_MODEL:deepseek-v4-pro}
    # Nằm trong khoá idempotency — PHẢI tăng mỗi khi nội dung prompt đổi, nếu không các chunk
    # đã xử lý sẽ không bao giờ được sinh lại bằng prompt mới.
    # v3: định nghĩa rõ generationEligible + yêu cầu sourceExcerpt trích nguyên văn.
    prompt-version: ${GENERATION_PROMPT_VERSION:docgen-mvp-flash-v3}
    pipeline-mode: ${GENERATION_PIPELINE_MODE:single_call}
    default-pipeline: ${GENERATION_DEFAULT_PIPELINE:LEGACY_V3}
    grounded-v4-enabled: ${GENERATION_GROUNDED_V4_ENABLED:true}
    timeout-seconds: ${GENERATION_TIMEOUT_SECONDS:60}
    connect-timeout-seconds: ${GENERATION_CONNECT_TIMEOUT_SECONDS:10}
    max-connections: ${GENERATION_MAX_CONNECTIONS:10}
    max-retries: ${GENERATION_MAX_RETRIES:1}
    max-concurrent-calls: ${GENERATION_MAX_CONCURRENT_CALLS:2}
    circuit-breaker-failure-threshold: ${GENERATION_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
    circuit-breaker-cooldown-seconds: ${GENERATION_CIRCUIT_BREAKER_COOLDOWN_SECONDS:60}
    temperature: ${GENERATION_TEMPERATURE:0.7}
    top-p: ${GENERATION_TOP_P:0.9}
    max-output-tokens: ${GENERATION_MAX_OUTPUT_TOKENS:3200}
    llm-validation-enabled: ${GENERATION_LLM_VALIDATION_ENABLED:false}
    parallel-chunk-processing: ${GENERATION_PARALLEL_CHUNKS:true}
    chunk-parallelism: ${GENERATION_CHUNK_PARALLELISM:-1}
    input-price-per-million: ${GENERATION_INPUT_PRICE:0.14}
    output-price-per-million: ${GENERATION_OUTPUT_PRICE:0.56}
    fallback-input-price-per-million: ${GENERATION_FALLBACK_INPUT_PRICE:0.55}
    fallback-output-price-per-million: ${GENERATION_FALLBACK_OUTPUT_PRICE:2.20}
    knowledge-temperature: ${GENERATION_KNOWLEDGE_TEMPERATURE:0.1}
    question-temperature: ${GENERATION_QUESTION_TEMPERATURE:0.3}
    critic-temperature: ${GENERATION_CRITIC_TEMPERATURE:0.0}
    knowledge-max-output-tokens: ${GENERATION_KNOWLEDGE_MAX_OUTPUT_TOKENS:1200}
    question-max-output-tokens: ${GENERATION_QUESTION_MAX_OUTPUT_TOKENS:1800}
    critic-max-output-tokens: ${GENERATION_CRITIC_MAX_OUTPUT_TOKENS:900}

  training:
    records:
      review-enabled: ${TRAINING_RECORDS_REVIEW_ENABLED:false}
    evidence:
      delete-retry-ms: ${TRAINING_EVIDENCE_DELETE_RETRY_MS:600000}
  embedding:
    provider: ${EMBEDDING_PROVIDER:e5}
    model: ${EMBEDDING_MODEL:intfloat/multilingual-e5-small}
    dimension: ${EMBEDDING_DIMENSION:384}
    model-path: ${E5_MODEL_PATH:models/intfloat/multilingual-e5-small}
    # Model native nặng; không chặn HTTP readiness khi khởi động bình thường.
    # Bật rõ E5_PRELOAD=true ở môi trường cần warm-up trước request đầu tiên.
    preload: ${E5_PRELOAD:false}
    backfill-on-startup: ${E5_BACKFILL_ON_STARTUP:false}
    max-length: ${E5_MAX_LENGTH:512}
    timeout-seconds: ${E5_TIMEOUT_SECONDS:30}
    fallback-provider: ${E5_FALLBACK_PROVIDER:lexical}
    dedup-page-size: ${E5_DEDUP_PAGE_SIZE:500}
    lexical-page-size: ${E5_LEXICAL_PAGE_SIZE:500}
    cache-ttl-minutes: ${E5_CACHE_TTL_MINUTES:30}
    cache-warmup-enabled: ${E5_CACHE_WARMUP_ENABLED:false}
    # Tắt mặc định: đo thực tế recall@1 chỉ 0.163, quét đầy đủ vài trăm/vài nghìn vector chỉ tốn
    # ~0.1ms — chỉ đáng bật khi ngân hàng câu hỏi đủ lớn (~10k+ câu). Xem ai-models.md §9.3.
    ann-enabled: ${E5_ANN_ENABLED:false}
    ann-lsh-bits: ${E5_ANN_LSH_BITS:16}
    ann-search-k: ${E5_ANN_SEARCH_K:50}
    ann-neighbor-buckets: ${E5_ANN_NEIGHBOR_BUCKETS:true}
    batch-size: ${E5_BATCH_SIZE:32}
    batch-enabled: ${E5_BATCH_ENABLED:true}
    backfill-async: ${E5_BACKFILL_ASYNC:true}
    intra-op-threads: ${E5_INTRA_OP_THREADS:-1}
    inter-op-threads: ${E5_INTER_OP_THREADS:1}
  paraphrase:
    provider: ${PARAPHRASE_PROVIDER:vietquill}
    model: ${PARAPHRASE_MODEL:ngwgsang/vietquill-vit5-base-tsubaki}
    model-path: ${VIETQUILL_MODEL_PATH:models/ngwgsang/vietquill-vit5-base-tsubaki}
    # VietQuill warm-up chạy đồng bộ và có thể mất hàng chục giây.
    # Chỉ bật ở worker/production đã chuẩn bị đủ RAM và model.
    preload: ${VIETQUILL_PRELOAD:false}
    max-input-length: ${VIETQUILL_MAX_INPUT_LENGTH:512}
    max-output-length: ${VIETQUILL_MAX_OUTPUT_LENGTH:256}
    timeout-seconds: ${VIETQUILL_TIMEOUT_SECONDS:60}
    generate-timeout-seconds: ${VIETQUILL_GENERATE_TIMEOUT_SECONDS:30}
    num-beams: ${VIETQUILL_NUM_BEAMS:6}
    max-decode-length: ${VIETQUILL_MAX_DECODE_LENGTH:160}
    requested-count-default: ${VIETQUILL_REQUESTED_COUNT_DEFAULT:3}
    paraphrase-options: ${VIETQUILL_PARAPHRASE_OPTIONS:false}
    pool-size: ${VIETQUILL_POOL_SIZE:2}
    acquire-timeout-ms: ${VIETQUILL_ACQUIRE_TIMEOUT_MS:30000}
    kv-cache-enabled: ${VIETQUILL_KV_CACHE_ENABLED:false}
    # Ngưỡng validate biến thể qua cosine(gốc, biến thể) trên E5. Hiệu chỉnh trên mẫu 15 câu/40
    # biến thể thật (xem developer_docs/ai/benchmarks/hieu-chinh-nguong-ngu-nghia-paraphrase-vietquill.md)
    # — mẫu còn nhỏ, nên chạy lại trên 100+ câu trước khi tin tưởng tuyệt đối.
    low-source-semantic-similarity: ${VIETQUILL_LOW_SOURCE_SEMANTIC_SIMILARITY:0.95}
    review-source-semantic-similarity: ${VIETQUILL_REVIEW_SOURCE_SEMANTIC_SIMILARITY:0.97}
    low-option-semantic-similarity: ${VIETQUILL_LOW_OPTION_SEMANTIC_SIMILARITY:0.95}

document:
  storage-path: ${DOCUMENT_STORAGE_PATH:storage/documents}
  supported-file-types:
    - pdf
    - docx
    - txt
    - md
  questions-per-chunk: ${DOCUMENT_QUESTIONS_PER_CHUNK:3}
  chunk:
    target-tokens: ${DOCUMENT_CHUNK_TARGET_TOKENS:750}
    max-tokens: ${DOCUMENT_CHUNK_MAX_TOKENS:1200}
    overlap-tokens: ${DOCUMENT_CHUNK_OVERLAP_TOKENS:80}
    min-useful-text-length: ${DOCUMENT_CHUNK_MIN_USEFUL_TEXT_LENGTH:80}

validation:
  # Ngưỡng cosine cho chống trùng ngữ nghĩa (embedding E5, thang 0-1).
  # Hiệu chỉnh trên 270 câu hỏi seed thật (36.315 cặp): p50=0,832  p99=0,889  max=0,973.
  # Thang điểm của E5 bị nén trong dải hẹp nên ngưỡng cũ 0,80 nằm DƯỚI trung vị và gắn cờ
  # "có khả năng trùng" cho 94,7% số cặp — hàng đợi duyệt ngập cảnh báo giả.
  # Đây là số từ dữ liệu seed. Đo lại trên ngân hàng thật bằng:
  #   RUN_E5_CALIBRATION=true ./mvnw.cmd test -Dtest=E5SimilarityCalibrationTest
  duplicate:
    strong-min: ${VALIDATION_DUPLICATE_STRONG_MIN:0.95}   # >= : loại thẳng (~0,01% số cặp)
    review-min: ${VALIDATION_DUPLICATE_REVIEW_MIN:0.88}   # >= : gắn cờ xem lại (~2,4% số cặp)
    # Ngưỡng riêng cho đường lexical fallback (Jaccard trên tập từ, KHÁC thang cosine ở trên).
    # Chỉ dùng khi provider=lexical hoặc E5 lỗi/chưa backfill xong.
    # Hiệu chỉnh trên 270 câu seed — xem developer_docs/ai/benchmarks/hieu-chinh-nguong-trung-lap-lexical-jaccard.md
    lexical-strong-min: ${VALIDATION_DUPLICATE_LEXICAL_STRONG_MIN:0.80}
    # 0.20 (ngưỡng hiệu chỉnh gốc) chỉ vừa trên p99 của các cặp KHÁC bài (0,192) nên vẫn lọt rất
    # nhiều câu chỉ trùng lác đác từ ngữ vào danh sách "có khả năng trùng". Nâng lên 0.5 để chỉ giữ
    # lại các câu thực sự đáng ngờ, gần vùng "trùng mạnh" (0.80) hơn.
    lexical-review-min: ${VALIDATION_DUPLICATE_LEXICAL_REVIEW_MIN:0.50}
  quality:
    reject-min: ${VALIDATION_QUALITY_REJECT_MIN:0.55}

spring:
  profiles:
    # Development uses the shared VPS unless production/test is selected explicitly.
    default: dev

  devtools:
    restart:
      enabled: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      data-source-properties:
        TimeZone: Asia/Ho_Chi_Minh
        connectTimeout: ${DB_CONNECT_TIMEOUT_SECONDS:10}
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:30}

  rabbitmq:
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    connection-timeout: 10s
    requested-heartbeat: 30s

  jpa:
    hibernate:
      # Schema changes are owned by versioned Flyway migrations. Override only
      # for an isolated developer database that is never shared.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Every runtime profile decides which reviewed baseline it owns.
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true

  mail:
    host: ${MAIL_HOST:smtp.mx.cloudflare.net}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:api_token}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          starttls:
            enable: false
            required: false

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${BUCKET_NAME}
